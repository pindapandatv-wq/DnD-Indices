<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&amp;D 3.5 Magic Item Index</title>
<style>
:root{--gold:#8a6a1f;--bgimg:none;--bg:#f6f4ef;--panel:#fff;--ink:#23201c;--mute:#7a7366;--line:#e4dfd3;--acc:#8a2b1f;--acc2:#b8452f;--hov:#faf6ec;--chip:#efe9da;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(60,40,10,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--panel:#05070d;--ink:#e3e9ff;--mute:#7b87b0;--line:#142044;--acc:#4f8bff;--acc2:#86b0ff;--gold:#dcb865;--hov:#0a1330;--chip:#0b1430;--sh:0 0 0 1px rgba(79,139,255,.08),0 10px 30px rgba(0,0,0,.9);--bgimg:radial-gradient(900px 400px at 85% -10%,rgba(50,90,255,.10),transparent 60%)}}
:root[data-theme=dark]{--bg:#000;--panel:#05070d;--ink:#e3e9ff;--mute:#7b87b0;--line:#142044;--acc:#4f8bff;--acc2:#86b0ff;--gold:#dcb865;--hov:#0a1330;--chip:#0b1430;--sh:0 0 0 1px rgba(79,139,255,.08),0 10px 30px rgba(0,0,0,.9);--bgimg:radial-gradient(900px 400px at 85% -10%,rgba(50,90,255,.10),transparent 60%)}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);background-image:var(--bgimg);background-attachment:fixed;color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{max-width:1500px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 28px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.2px}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}
main{max-width:1500px;margin:0 auto;padding:12px 20px 40px}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters .wide{grid-column:span 2}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
input,select{font:14px system-ui;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;text-transform:none;letter-spacing:0}
input:focus,select:focus{outline:2px solid var(--acc2);outline-offset:-1px}
.rng{display:flex;gap:6px}
.types{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip small{opacity:.65;margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--mute);gap:10px;flex-wrap:wrap}
.bar b{color:var(--ink)}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:auto;max-height:78vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1350px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);cursor:pointer;user-select:none;border-bottom:2px solid var(--line)}
th:hover{color:var(--acc)}
th.s{color:var(--acc)}
th.s::after{content:" ▲";font-size:9px}th.s.d::after{content:" ▼"}
td.n,th.n{position:sticky;left:0;background:var(--panel);z-index:1;font-weight:600}
th.n{z-index:3}
tbody tr:hover td{background:var(--hov)}
td.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}
td.wr{white-space:normal;min-width:170px;max-width:260px}
.t{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--chip)}
.al{font-weight:600;color:var(--acc)}
.src{color:var(--mute);font-size:12px;cursor:help}
.dim{color:var(--mute)}
.pg{display:flex;gap:6px;align-items:center}
.empty{padding:40px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:640px;width:92vw;max-height:80vh;overflow:auto;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}dt{font-weight:600}dd{margin:0;color:var(--mute)}

tbody tr{cursor:pointer}
table.compact{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--mute);padding:6px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:var(--bg)}
#det{max-width:560px;padding:0}
#det .top{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.sb{padding:18px 22px 22px}
.sb h2{margin:0;font:700 26px/1.1 Georgia,serif;color:var(--acc)}
.sb .meta{color:var(--mute);font-style:italic;margin:4px 0 10px}
.sb hr{border:0;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin:8px 0 12px;border-radius:2px}
.sb .row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.sb .row b{color:var(--gold)}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0 8px}
.abil div{background:var(--chip);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 2px}
.abil small{display:block;color:var(--mute);font-size:10px;letter-spacing:.08em}
.abil strong{font-size:18px}.abil em{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.sb h4{margin:14px 0 4px;color:var(--gold);font:600 12px system-ui;text-transform:uppercase;letter-spacing:.08em}
.sb ul{margin:0;padding-left:18px}
@media(max-width:640px){.sb .row{grid-template-columns:100px 1fr}}
@media(max-width:640px){.filters .wide{grid-column:auto}}

:root[data-theme=dark] .wrap,:root[data-theme=dark] .filters{border-color:#16264f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .wrap,:root:not([data-theme=light]) .filters{border-color:#16264f}}
:root[data-theme=dark] h1 span{text-shadow:0 0 18px rgba(79,139,255,.55)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) h1 span{text-shadow:0 0 18px rgba(79,139,255,.55)}}

table{min-width:1500px}
td.fx{min-width:320px;max-width:420px}
#sb .row span{line-height:1.45}
</style></head><body>
<header>
 <div><h1>D&amp;D 3.5 <span>Magic Item Index</span></h1><div class="sub">Personal items, weapons, armor, wands, rods &amp; more · sortable &amp; filterable</div></div>
 <div style="display:flex;gap:8px"><button class="btn" id="key">Sourcebook key</button><button class="btn" id="theme">◐ Theme</button></div>
</header>
<main>
 <section class="filters">
  <label class="wide">Search<input id="q" type="search" placeholder="Name, effect, requirements, tags…"></label>

  <div class="types" id="types"></div>

</main>
<dialog id="det"><div class="top"><div><button class="btn" id="dp">‹ Prev</button> <button class="btn" id="dn">Next ›</button></div><button class="btn" id="dx">Close</button></div><div class="sb" id="sb"></div></dialog>
<dialog id="dlg"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Key to Sourcebooks</b><button class="btn" onclick="dlg.close()">Close</button></div><dl id="kl"></dl></dialog>

const R=DATA.rows,KEY=DATA.key,PS=100;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AU=['Faint','Moderate','Strong','Overwhelming','Varies'];
const f$=v=>v==null?'—':v.toLocaleString('en-US',{maximumFractionDigits:2});
const auTxt=r=>[r.au,r.sch.join(', ')].filter(Boolean).join(' · ');
const catRank={};[...new Set(R.map(r=>r.cat))].forEach((c,i)=>catRank[c]=i);
const cols=[
 ['n','Name','n',r=>r.n],['cat','Category','',r=>catRank[r.cat]],['slot','Slot','',r=>r.slot],['tags','Tags','',r=>r.tags.join(', ')],
 ['au','Aura','',r=>r.au?AU.indexOf(r.au):null],['sch','School','',r=>r.sch.join(', ')],['cl','CL','num',r=>r.clv],
 ['gp','Create gp','num',r=>r.gp],['xp','XP','num',r=>r.xp],['sell','Sell gp','num',r=>r.sell],['ft','Crafting feat','',r=>r.ft],['fx','Effect','',r=>r.fx],['src','Source','',r=>r.ref[0]||'']
];
const CMP=['n','cat','slot','au','cl','sell'];
let sort={k:'n',d:false},page=0,types=new Set(),view=R,mode='compact',cur=-1;
const vis=()=>mode=='compact'?cols.filter(c=>CMP.includes(c[0])):cols;
const norm=s=>s.toLowerCase();
R.forEach((r,i)=>{r.i=i;r._s=norm([r.n,r.fx,r.slot,r.tags.join(' '),r.sch.join(' '),r.au,r.req.join(' '),r.cat,r.ref.join(' '),r.mark,r.ap].join(' | '))});
function fill(id,vals,lab){const s=$(id);[...vals].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=lab?lab(v):v;s.appendChild(o)})}
const cnt=f=>{const m={};R.forEach(r=>f(r).forEach(v=>v&&(m[v]=(m[v]||0)+1)));return m};
const by=m=>Object.keys(m).sort();
const sl=cnt(r=>r.slot?[r.slot.replace(/ \(\d\)/,'')]:[]);fill('slot',by(sl),v=>`${v} (${sl[v]})`);
const ac=cnt(r=>r.au?[r.au]:[]);fill('au',AU.filter(a=>ac[a]),v=>`${v} (${ac[v]})`);
const sc=cnt(r=>r.sch);fill('sch',by(sc),v=>`${v} (${sc[v]})`);
const tg=cnt(r=>r.tags);fill('tag',by(tg),v=>`${v} (${tg[v]})`);
const fc=cnt(r=>r.ft?[r.ft]:[]);fill('ft',Object.keys(fc).sort((a,b)=>fc[b]-fc[a]),v=>`${v} (${fc[v]})`);
const bc=cnt(r=>r.bk);fill('bk',Object.keys(bc).sort((a,b)=>bc[b]-bc[a]),v=>`${v}${KEY[v]?' – '+KEY[v]:''} (${bc[v]})`);
const tc=cnt(r=>[r.cat]);
Object.keys(tc).sort((a,b)=>catRank[a]-catRank[b]).forEach(t=>{const c=document.createElement('button');c.className='chip';c.innerHTML=`${esc(t)}<small>${tc[t]}</small>`;c.onclick=()=>{types.has(t)?types.delete(t):types.add(t);c.classList.toggle('on');apply()};$('types').appendChild(c)});
function head(){$('hr').innerHTML=vis().map(c=>`<th data-k="${c[0]}" class="${c[2]}">${c[1]}</th>`).join('');document.querySelector('table').classList.toggle('compact',mode=='compact')}head();
$('hr').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sort=sort.k==k?{k,d:!sort.d}:{k,d:false};page=0;draw()};
const num=id=>{const v=$(id).value;return v===''?null:+v};
const srcTitle=x=>{const b=x.split(' ')[0],bb=b.replace(/\d+$/,'');return x+(KEY[b]?' – '+KEY[b]:/^DR\d/.test(b)?' – Dragon Magazine':/^DU\d/.test(b)?' – Dungeon Magazine':KEY[bb]?' – '+KEY[bb]:'')};
const dash='<span class="dim">—</span>',nn=v=>v==null||v===''?dash:v;
const cell={n:r=>`<td class="n">${esc(r.n)}</td>`,cat:r=>`<td><span class="t">${esc(r.cat)}</span></td>`,slot:r=>`<td>${nn(esc(r.slot))}</td>`,
 tags:r=>`<td class="wr">${r.tags.length?r.tags.map(esc).join(', '):dash}${r.combo?' <span class="dim">(combo)</span>':''}</td>`,
 au:r=>`<td>${auTxt(r)?esc(auTxt(r)):dash}</td>`,sch:r=>`<td>${r.sch.length?esc(r.sch.join(', ')):dash}</td>`,cl:r=>`<td class="num">${nn(esc(r.cl))}</td>`,

function apply(){
 const q=norm($('q').value.trim()).split(/\s+/).filter(Boolean),sl=$('slot').value,au=$('au').value,sc=$('sch').value,tg=$('tag').value,ft=$('ft').value,bk=$('bk').value;
 const [a,b,c,d]=['clmin','clmax','pmin','pmax'].map(num);
 view=R.filter(r=>(!q.length||q.every(w=>r._s.includes(w)))&&(!sl||r.slot.replace(/ \(\d\)/,'')==sl)&&(!au||r.au==au)&&(!sc||r.sch.includes(sc))&&(!tg||r.tags.includes(tg))&&(!ft||r.ft==ft)&&(!bk||r.bk.includes(bk))&&
  (!types.size||types.has(r.cat))&&(a==null||(r.clv!=null&&r.clv>=a))&&(b==null||(r.clv!=null&&r.clv<=b))&&(c==null||(r.sell!=null&&r.sell>=c))&&(d==null||(r.sell!=null&&r.sell<=d)));
 page=0;draw()}
function draw(){
 const col=cols.find(c=>c[0]==sort.k),f=col[3],m=sort.d?-1:1;
 view=view.slice().sort((x,y)=>{let p=f(x),q=f(y);const pn=p==null||p!==p||p==='',qn=q==null||q!==q||q==='';if(pn||qn)return pn&&qn?x.n.localeCompare(y.n):pn?1:-1;
  return (typeof p=='number'&&typeof q=='number'?p-q:String(p).localeCompare(String(q),undefined,{numeric:true}))*m||x.n.localeCompare(y.n)});
 document.querySelectorAll('th').forEach(t=>{t.classList.toggle('s',t.dataset.k==sort.k);t.classList.toggle('d',t.dataset.k==sort.k&&sort.d)});

 $('tb').innerHTML=view.slice(page*PS,page*PS+PS).map(r=>`<tr data-i="${r.i}">${V.map(c=>cell[c[0]](r)).join('')}</tr>`).join('');
 $('tb').parentElement.parentElement.scrollTop=0}
['q','clmin','clmax','pmin','pmax'].forEach(i=>$(i).oninput=apply);
['slot','au','sch','tag','ft','bk'].forEach(i=>$(i).onchange=apply);
$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};
$('reset').onclick=()=>{document.querySelectorAll('input,select').forEach(e=>e.value='');types.clear();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));apply()};
$('key').onclick=()=>{$('kl').innerHTML=Object.entries(KEY).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');$('dlg').showModal()};
$('theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};
function show(i){cur=i;const r=R[i],pos=view.indexOf(r);
 const row=(k,v)=>v?`<div class="row"><b>${k}</b><span>${v}</span></div>`:'';
 const meta=[r.cat,r.slot&&('Slot: '+r.slot),r.mark&&('Mark: '+r.mark),r.ap&&('For: '+r.ap)].filter(Boolean).map(esc).join(' · ');
 const price=(r.gp!=null||r.xp!=null)?`${f$(r.gp)} gp${r.xp!=null?' + '+f$(r.xp)+' XP':''}`:'';
 $('sb').innerHTML=`<h2>${esc(r.n)}</h2><div class="meta">${meta}</div><hr>
 ${row('Effect',esc(r.fx).replace(/\n/g,'<br>'))}${row('Aura',esc([r.au,r.sch.join(', ')].filter(Boolean).join(' – '))+(r.ds.length?' <span class="dim">['+r.ds.map(esc).join(', ')+']</span>':''))}${row('Caster Level',esc(r.cl))}
 ${row('Tags',r.tags.map(esc).join(', ')+(r.combo?' <span class="dim">(combo)</span>':''))}${row('Requirements',r.req.map(esc).join('<br>'))}
 ${row('Cost to create',price)}${row('Market price',r.sell!=null?f$(r.sell)+' gp':'')}${row('Extra cost',r.ex!=null?'+'+f$(r.ex)+' gp':'')}${row('Counts as bonus',esc(r.bonus))}
 <h4>Sources</h4><ul>${r.ref.map(x=>`<li>${esc(srcTitle(x))}</li>`).join('')||'<li class="dim">—</li>'}</ul>`;
 $('dp').disabled=pos<=0;$('dn').disabled=pos<0||pos>=view.length-1;
 if(!$('det').open)$('det').showModal();$('det').scrollTop=0}
const step=d=>{const p=view.indexOf(R[cur])+d;if(view[p])show(view[p].i)};
$('tb').onclick=e=>{const tr=e.target.closest('tr');if(tr)show(+tr.dataset.i)};
$('dp').onclick=()=>step(-1);$('dn').onclick=()=>step(1);$('dx').onclick=()=>$('det').close();
$('det').addEventListener('click',e=>{if(e.target==$('det'))$('det').close()});
addEventListener('keydown',e=>{if($('det').open){if(e.key=='ArrowLeft')step(-1);if(e.key=='ArrowRight')step(1)}});
$('vm').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#vm button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));if(!vis().some(c=>c[0]==sort.k))sort={k:'n',d:false};head();draw()};
apply();
